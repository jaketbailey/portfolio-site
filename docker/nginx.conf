# Every other domain the tunnel sends here gets a permanent redirect to the
# canonical one, keeping the path and query string.
server {
    listen 8080;
    server_name jaketbailey.co.uk jaketbailey.com www.jaketbailey.com;
    return 301 https://www.jaketbailey.co.uk$request_uri;
}

# The site itself. Also the default, so it still answers on the LAN by IP.
server {
    listen 8080 default_server;
    server_name www.jaketbailey.co.uk;
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The gallery, mounted from the host. The manifest is revalidated on every
    # load so edits show up straight away; the images change rarely.
    location /photos/ {
        location = /photos/gallery.json {
            add_header Cache-Control "no-cache";
        }
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Client-side routes (/gallery etc.) all fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
