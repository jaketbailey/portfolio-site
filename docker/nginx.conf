server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The gallery, mounted from the host. The manifest is revalidated on every
    # load so edits show up straight away; the images change rarely.
    location /photos/ {
        location = /photos/gallery.json {
            add_header Cache-Control "no-cache";
        }
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Client-side routes (/gallery etc.) all fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
