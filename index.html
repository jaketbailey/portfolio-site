<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Jake Bailey</title>
    <meta
      name="description"
      content="Jake Bailey — software engineer, hobby photographer and outdoors enthusiast based in the UK."
    />
    <meta property="og:title" content="Jake Bailey" />
    <meta
      property="og:description"
      content="Jake Bailey — software engineer, hobby photographer and outdoors enthusiast based in the UK."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/jake_portrait.webp" />
    <meta name="twitter:card" content="summary" />
    <!-- Browser/status bar colour: the page background. The script below and
         useTheme switch it with the theme. These hex values are the
         --color-page values in src/styles/tailwind.css. -->
    <meta name="theme-color" content="#f5f7f3" />

    <!-- Apply the stored theme before the first paint so there's no flash of
         the wrong colours (and the toggle icon starts out correct). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#17201b' : '#f5f7f3')
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Figtree:ital,wght@0,400..700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
