<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Jake Bailey</title>
    <meta
      name="description"
      content="Jake Bailey — software engineer, runner and hobby photographer based in the UK."
    />
    <meta property="og:title" content="Jake Bailey" />
    <meta
      property="og:description"
      content="Jake Bailey — software engineer, runner and hobby photographer based in the UK."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/jake_portrait.webp" />
    <meta name="twitter:card" content="summary" />

    <!-- Apply the stored theme before the first paint so there's no flash of
         the wrong colours (and the toggle icon starts out correct). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;700&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
